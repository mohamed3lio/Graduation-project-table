<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة | مشروع الصيانة التنبؤية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .kanban-col { min-height: 65vh; transition: all 0.3s ease; }
        .kanban-col.drag-over { background-color: #e2e8f0; border: 2px dashed #64748b; border-radius: 0.75rem; }
        .task-card { transition: all 0.2s ease; cursor: grab; user-select: none; }
        .task-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .task-card:active { cursor: grabbing; transform: scale(0.98); }
        .dragging { opacity: 0.4; transform: scale(1.02); }
        
        /* Team Colors */
        .team-ld { background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%); border-right: 4px solid #9333ea; }
        .team-hw { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border-right: 4px solid #2563eb; }
        .team-ai { background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%); border-right: 4px solid #ea580c; }
        .team-sw { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-right: 4px solid #16a34a; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; rounded: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 pb-10">

    <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        <!-- Header & Progress -->
        <header class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-2 h-full bg-blue-600"></div>
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight"><i class="fa-solid fa-microchip text-blue-600 ml-2"></i>نظام إدارة مشروع الصيانة التنبؤية</h1>
                    <p class="text-gray-500 mt-1 font-medium">لوحة التحكم التفاعلية لفريق العمل (10 أعضاء)</p>
                </div>
                <div class="w-full md:w-1/3 bg-gray-50 p-3 rounded-lg border border-gray-100">
                    <div class="flex justify-between text-sm mb-1 font-bold">
                        <span class="text-gray-700">نسبة إنجاز المشروع</span>
                        <span id="progress-text" class="text-blue-600">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="mt-6 flex flex-wrap gap-2 border-t border-gray-100 pt-4">
                <span class="text-sm font-bold text-gray-400 py-1 ml-2"><i class="fa-solid fa-filter ml-1"></i>تصفية المهام:</span>
                <button onclick="filterTasks('all')" class="filter-btn bg-gray-800 text-white px-4 py-1 rounded-full text-sm font-semibold transition hover:bg-gray-700">الكل</button>
                <button onclick="filterTasks('ld')" class="filter-btn bg-purple-100 text-purple-800 border border-purple-200 px-4 py-1 rounded-full text-sm font-semibold transition hover:bg-purple-200">القيادة</button>
                <button onclick="filterTasks('hw')" class="filter-btn bg-blue-100 text-blue-800 border border-blue-200 px-4 py-1 rounded-full text-sm font-semibold transition hover:bg-blue-200">الهاردوير</button>
                <button onclick="filterTasks('ai')" class="filter-btn bg-orange-100 text-orange-800 border border-orange-200 px-4 py-1 rounded-full text-sm font-semibold transition hover:bg-orange-200">الذكاء الاصطناعي</button>
                <button onclick="filterTasks('sw')" class="filter-btn bg-green-100 text-green-800 border border-green-200 px-4 py-1 rounded-full text-sm font-semibold transition hover:bg-green-200">البرمجيات</button>
            </div>
        </header>

        <!-- Board -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- To Do -->
            <div class="bg-gray-100 rounded-2xl p-4 border border-gray-200 flex flex-col">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="text-lg font-bold text-gray-700"><i class="fa-regular fa-circle text-red-500 ml-2"></i>مهام مطلوبة</h2>
                    <span id="count-todo" class="bg-gray-200 text-gray-600 py-0.5 px-2.5 rounded-full text-sm font-bold">0</span>
                </div>
                <div class="kanban-col flex-1 space-y-3" id="todo"></div>
            </div>

            <!-- In Progress -->
            <div class="bg-gray-100 rounded-2xl p-4 border border-gray-200 flex flex-col">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="text-lg font-bold text-blue-700"><i class="fa-solid fa-spinner fa-spin-pulse text-blue-500 ml-2"></i>قيد التنفيذ</h2>
                    <span id="count-inprogress" class="bg-blue-100 text-blue-700 py-0.5 px-2.5 rounded-full text-sm font-bold">0</span>
                </div>
                <div class="kanban-col flex-1 space-y-3" id="inprogress"></div>
            </div>

            <!-- Done -->
            <div class="bg-gray-100 rounded-2xl p-4 border border-gray-200 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="text-lg font-bold text-green-700"><i class="fa-solid fa-check-double text-green-500 ml-2"></i>مكتملة</h2>
                    <span id="count-done" class="bg-green-100 text-green-700 py-0.5 px-2.5 rounded-full text-sm font-bold">0</span>
                </div>
                <div class="kanban-col flex-1 space-y-3" id="done"></div>
            </div>

        </div>

        <!-- Reset Button -->
        <div class="mt-10 text-center">
            <button onclick="resetBoard()" class="text-sm text-gray-400 hover:text-red-500 transition underline"><i class="fa-solid fa-trash-can ml-1"></i>إعادة ضبط اللوحة (حذف التقدم)</button>
        </div>
    </div>

    <script>
        // الداتا الأساسية للمشروع (كل الخطوات من الآن للمناقشة)
        const initialTasks = [
            { id: 't1', text: 'التواصل مع إدارة المصنع وتحديد موعد الزيارة الميدانية', team: 'ld', teamName: 'Team Leader', col: 'todo' },
            { id: 't2', text: 'تجهيز وطباعة استبيان الأعطال لاصطحابه في المصنع', team: 'ld', teamName: 'Team Leader', col: 'todo' },
            { id: 't3', text: 'شراء المتحكم ESP32 وحساس الاهتزاز MPU6050 والحرارة', team: 'hw', teamName: 'Hardware (4)', col: 'todo' },
            { id: 't4', text: 'تجهيز بيئة MATLAB وبدء محاكاة إشارة اهتزاز افتراضية', team: 'ai', teamName: 'AI & DSP (3)', col: 'todo' },
            { id: 't5', text: 'إنشاء مساحة العمل على Grafana Cloud (سيرفر فرانكفورت)', team: 'sw', teamName: 'Software (2)', col: 'todo' },
            { id: 't6', text: 'اختبار الحساسات وتوصيلها على Breadboard للتأكد من القراءات', team: 'hw', teamName: 'Hardware (4)', col: 'todo' },
            { id: 't7', text: 'كتابة كود تطبيق تحويل فورير السريع (FFT) لاستخراج الترددات', team: 'ai', teamName: 'AI & DSP (3)', col: 'todo' },
            { id: 't8', text: 'إعداد وسيط الرسائل MQTT Broker وتجهيز قاعدة بيانات InfluxDB', team: 'sw', teamName: 'Software (2)', col: 'todo' },
            { id: 't9', text: 'تصميم المخطط الكهربائي (Schematic) وتصنيع اللوحة المطبوعة (PCB)', team: 'hw', teamName: 'Hardware (4)', col: 'todo' },
            { id: 't10', text: 'تدريب نموذج كشف الشذوذ (Isolation Forest) على البيانات الطبيعية', team: 'ai', teamName: 'AI & DSP (3)', col: 'todo' },
            { id: 't11', text: 'تصميم واجهة المستخدم (Dashboard) لعرض الحرارة والاهتزاز وحالة الماكينة', team: 'sw', teamName: 'Software (2)', col: 'todo' },
            { id: 't12', text: 'تصميم وطباعة الغلاف الميكانيكي (3D Enclosure) والقاعدة المغناطيسية', team: 'hw', teamName: 'Hardware (4)', col: 'todo' },
            { id: 't13', text: 'استخدام Edge Impulse لضغط النموذج ورفعه على ESP32 (TinyML)', team: 'ai', teamName: 'AI & DSP (3)', col: 'todo' },
            { id: 't14', text: 'برمجة وتفعيل نظام التنبيهات الفورية عبر Telegram', team: 'sw', teamName: 'Software (2)', col: 'todo' },
            { id: 't15', text: 'التكامل الشامل (Integration) بين الهاردوير والسيرفر والنموذج', team: 'ld', teamName: 'Team Leader', col: 'todo' },
            { id: 't16', text: 'التركيب الميداني على الماكينة الحقيقية في المصنع وسحب البيانات', team: 'hw', teamName: 'Hardware (4)', col: 'todo' },
            { id: 't17', text: 'كتابة التقرير النهائي للمشروع (Graduation Thesis) وتنسيقه', team: 'ld', teamName: 'Team Leader', col: 'todo' },
            { id: 't18', text: 'تجهيز العرض التقديمي (Presentation) والاستعداد للمناقشة', team: 'ld', teamName: 'Team Leader', col: 'todo' }
        ];

        // تحميل المهام من المتصفح (Local Storage) أو استخدام الأساسية
        let tasks = JSON.parse(localStorage.getItem('pdm_tasks')) || initialTasks;
        let currentFilter = 'all';

        function renderTasks() {
            document.getElementById('todo').innerHTML = '';
            document.getElementById('inprogress').innerHTML = '';
            document.getElementById('done').innerHTML = '';

            let counts = { todo: 0, inprogress: 0, done: 0 };
            let visibleTasks = 0;
            let completedVisible = 0;

            tasks.forEach(task => {
                if(currentFilter !== 'all' && task.team !== currentFilter) return; // تطبيق الفلتر

                counts[task.col]++;
                visibleTasks++;
                if(task.col === 'done') completedVisible++;

                const el = document.createElement('div');
                el.className = `task-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 team-${task.team} mb-3 flex flex-col gap-2`;
                el.draggable = true;
                el.id = task.id;
                
                // إضافة شكل خافت للمهام المكتملة
                if(task.col === 'done') {
                    el.classList.add('opacity-60');
                }

                el.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black px-2.5 py-1 rounded-md bg-white/60 shadow-sm">${task.teamName}</span>
                        ${task.col === 'done' ? '<i class="fa-solid fa-circle-check text-green-600"></i>' : '<i class="fa-solid fa-grip-vertical text-gray-400"></i>'}
                    </div>
                    <p class="font-bold text-sm text-gray-800 leading-relaxed mt-1 ${task.col === 'done' ? 'line-through text-gray-500' : ''}">${task.text}</p>
                `;

                // أحداث السحب
                el.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', task.id);
                    setTimeout(() => el.classList.add('dragging'), 0);
                });
                el.addEventListener('dragend', () => el.classList.remove('dragging'));

                document.getElementById(task.col).appendChild(el);
            });

            // تحديث العدادات وشريط التقدم
            document.getElementById('count-todo').innerText = counts.todo;
            document.getElementById('count-inprogress').innerText = counts.inprogress;
            document.getElementById('count-done').innerText = counts.done;

            let percentage = visibleTasks === 0 ? 0 : Math.round((completedVisible / visibleTasks) * 100);
            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('progress-text').innerText = percentage + '%';

            // إضافة تأثيرات ألوان لشريط التقدم
            let pBar = document.getElementById('progress-bar');
            if(percentage === 100) pBar.className = 'h-2.5 rounded-full transition-all duration-500 ease-out bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.6)]';
            else pBar.className = 'h-2.5 rounded-full transition-all duration-500 ease-out bg-blue-600';

            // حفظ في المتصفح
            localStorage.setItem('pdm_tasks', JSON.stringify(tasks));
        }

        // إعداد مناطق الإفلات
        document.querySelectorAll('.kanban-col').forEach(col => {
            col.addEventListener('dragover', e => {
                e.preventDefault();
                col.classList.add('drag-over');
            });
            col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
            col.addEventListener('drop', e => {
                e.preventDefault();
                col.classList.remove('drag-over');
                const id = e.dataTransfer.getData('text/plain');
                const taskIndex = tasks.findIndex(t => t.id === id);
                if (taskIndex > -1) {
                    tasks[taskIndex].col = col.id; // تحديث حالة المهمة
                    renderTasks();
                }
            });
        });

        // وظيفة الفلترة
        function filterTasks(team) {
            currentFilter = team;
            // تظليل الزر النشط
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-offset-1', 'opacity-100'));
            event.target.classList.add('ring-2', 'ring-offset-1');
            renderTasks();
        }

        // إعادة ضبط اللوحة
        function resetBoard() {
            if(confirm("هل أنت متأكد من مسح كل تقدم المشروع والعودة لنقطة الصفر؟")) {
                tasks = JSON.parse(JSON.stringify(initialTasks)); // Deep copy
                renderTasks();
            }
        }

        // تشغيل الرندر عند فتح الصفحة
        renderTasks();
    </script>
</body>
</html>
